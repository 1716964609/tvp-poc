apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-asset-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: job-asset-service
  template:
    metadata:
      labels:
        app: job-asset-service
    spec:
      containers:
        - name: job-asset-service
          image: 180294215932.dkr.ecr.ap-northeast-1.amazonaws.com/tvp/job-asset-service:4825c946df14b12f845d7c0ded660a8e4e0d5a65
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: job-asset-service
spec:
  selector:
    app: job-asset-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
