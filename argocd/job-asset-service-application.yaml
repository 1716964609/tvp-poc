apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: job-asset-service
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/1716964609/tvp-poc.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
